name: official_news
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^4.0.3
  cupertino_icons: ^2.0.0
  firebase_analytics: ^13.0.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  in_app_purchase: ^3.3.1
  intl: ^0.20.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Tests open the iOS Settings app through a fake launcher (push_test.dart).
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  # The app's logo in the Garnet and Seal mastheads (#66): the black N, and
  # the red one for dark mode.
  assets:
    - assets/logo_n.png
    - assets/logo_n_dark.png
  # The app's words in each language (#52): l10n.yaml, lib/l10n/*.arb.
  generate: true
