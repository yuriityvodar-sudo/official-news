# The app's own words in every language the Settings picker offers (#52):
# lib/l10n/app_en.arb is the template, with a description for every message;
# `flutter gen-l10n` (also run by `flutter pub get`) writes AppLocalizations
# next to it.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
nullable-getter: false
required-resource-attributes: true
format: true
