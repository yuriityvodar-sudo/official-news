name: TestFlight

# On demand only: Actions tab → TestFlight → Run workflow → pick a branch, and
# which build: `testflight` for the team's phones (the default), or `store` for
# the build we submit to App Review (#137). The choice marks the build
# (APP_BUILD), so analytics can leave the team's use out of every report.
# A `testflight` build also opens the AI chat to free Sandbox purchases, with
# the key CHAT_SANDBOX_KEY_TESTFLIGHT (#146), so it goes up for internal
# testing only: App Store Connect never lets it reach external testers or the
# App Store. Never submit one; submit a `store` build.
# Needs these repository secrets (see docs/setup.md). Yurii creates the API key
# with his Admin role on Roman's App Store Connect team and adds them himself:
#   APPLE_TEAM_ID      the RS Elite Pro team ID (10 characters)
#   ASC_KEY_ID         App Store Connect API key ID
#   ASC_ISSUER_ID      App Store Connect API issuer ID
#   ASC_KEY_P8_BASE64  the .p8 key file, base64-encoded
#   DIST_CERT_P12_BASE64     the Apple Distribution certificate with its private key (.p12), base64-encoded
#   DIST_CERT_P12_PASSWORD   the password that .p12 was exported with
# The certificate is imported into a keychain made for the run; the archive is
# built unsigned and the export signs it with that certificate, so a run never
# creates an Apple Development certificate of its own (every run did, until the
# team hit Apple's limit: #96).
# The app must already exist in App Store Connect with the bundle ID set in
# app/ios/Runner.xcodeproj. Builds use the live API at api.officialnews.workers.dev.

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Which build: testflight for the team, store for the App Store submission"
        type: choice
        options:
          - testflight
          - store
        default: testflight

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26) or later.
      # Pinned to the newest 26.x, so a new major Xcode never changes builds by surprise.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"
      - run: xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc_key.p8"

      - name: Read the Firebase values for analytics
        # From the GitHub secret GOOGLE_SERVICE_INFO_PLIST (base64 of the iOS
        # config file of Firebase project official-news-48e16, #60). Without it
        # the build works and sends no analytics.
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "::warning::GOOGLE_SERVICE_INFO_PLIST is not set, so this build sends no analytics (docs/setup.md)."
            exit 0
          fi
          plist="$RUNNER_TEMP/GoogleService-Info.plist"
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > "$plist"
          read_key() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist"; }
          echo "::add-mask::$(read_key API_KEY)"
          echo "FIREBASE_DEFINES=--dart-define=FIREBASE_API_KEY=$(read_key API_KEY) --dart-define=FIREBASE_APP_ID=$(read_key GOOGLE_APP_ID) --dart-define=FIREBASE_SENDER_ID=$(read_key GCM_SENDER_ID) --dart-define=FIREBASE_PROJECT_ID=$(read_key PROJECT_ID)" >> "$GITHUB_ENV"
          rm "$plist"

      - name: Import the Distribution certificate into a keychain for this run
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_P12_PASSWORD: ${{ secrets.DIST_CERT_P12_PASSWORD }}
        run: |
          if [ -z "$DIST_CERT_P12_BASE64" ] || [ -z "$DIST_CERT_P12_PASSWORD" ]; then
            echo "::error::DIST_CERT_P12_BASE64 and DIST_CERT_P12_PASSWORD must be set (docs/setup.md, #96)."
            exit 1
          fi
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$DIST_CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/dist.p12"
          # Let codesign use the key without a prompt, and put the keychain first in the search list.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '" ')
          security default-keychain -d user -s "$keychain"
          identities=$(security find-identity -v -p codesigning "$keychain")
          echo "$identities"
          if ! echo "$identities" | grep -q "Apple Distribution"; then
            echo "::error::No valid Apple Distribution identity after the import: check the .p12, its password, and that it is a Distribution certificate."
            exit 1
          fi
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

      - name: Build the iOS app without signing
        # The live API, not the laptop default (app/lib/core/config.dart), the
        # build's mark (testflight or store), and the Firebase values when
        # there are any. Only a `testflight` build gets the key that opens the
        # AI chat to Sandbox purchases, from the GitHub secret
        # CHAT_SANDBOX_KEY_TESTFLIGHT (#146, docs/setup.md). Flutter hands
        # every --dart-define to Xcode in base64 (DART_DEFINES), which GitHub
        # does not know to hide, so that form of the key is masked first
        # (Yurii's review of #217; 81 bytes, so no `=` padding for Xcode to
        # escape), and the archive below runs quiet.
        env:
          APP_BUILD: ${{ inputs.build }}
          CHAT_SANDBOX_KEY: ${{ inputs.build == 'testflight' && secrets.CHAT_SANDBOX_KEY_TESTFLIGHT || '' }}
        run: |
          if [ -n "$CHAT_SANDBOX_KEY" ]; then
            echo "::add-mask::$(printf 'CHAT_SANDBOX_KEY=%s' "$CHAT_SANDBOX_KEY" | base64 | tr -d '\n')"
          elif [ "$APP_BUILD" = testflight ]; then
            echo "::warning::CHAT_SANDBOX_KEY_TESTFLIGHT is not set, so this build keeps the AI chat closed (docs/setup.md)."
          fi
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }} --dart-define=API_URL=https://api.officialnews.workers.dev --dart-define=APP_BUILD="$APP_BUILD" --dart-define=CHAT_SANDBOX_KEY="$CHAT_SANDBOX_KEY" --dart-define=BUILD_NUMBER=${{ github.run_number }} $FIREBASE_DEFINES

      - name: Archive without signing
        # Nothing is signed here, so this step never talks to the Apple account
        # and never creates a certificate. Xcode refuses a Distribution identity
        # on the Swift packages under automatic signing, so the signing happens
        # once, at the export below (the first try of #96 failed on that).
        # Quiet: a full log prints every build script's environment, with
        # DART_DEFINES in it (Yurii's review of #217).
        working-directory: app/ios
        run: |
          xcodebuild archive -quiet \
            -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Give the archived app its push entitlement
        # The archive above is unsigned, so it carries no entitlements, and the
        # export re-signs the app with the entitlements it already has: none.
        # Without aps-environment iOS never gives the app an APNs token, so no
        # push ever reached a phone (#149: "Apple token: no" on build 28). An
        # ad-hoc signature with the entitlements carries them into the export,
        # which replaces the signature and keeps them.
        run: |
          app="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app"
          ent="$RUNNER_TEMP/Runner.entitlements"
          cp "$GITHUB_WORKSPACE/app/ios/Runner/Runner.entitlements" "$ent"
          /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$ent"
          # The app's signature needs its frameworks signed; the vendors' already are.
          for f in "$app"/Frameworks/*.framework "$app"/Frameworks/*.dylib; do
            [ -e "$f" ] || continue
            codesign -v "$f" 2>/dev/null || codesign --force --sign - "$f"
          done
          codesign --force --sign - --entitlements "$ent" "$app"
          codesign -d --entitlements - "$app"

      - name: Check that the signed app can receive pushes
        # Signs a copy the way the upload below does and stops before anything
        # reaches TestFlight when aps-environment is not production (#149).
        working-directory: app/ios
        run: |
          cat > "$RUNNER_TEMP/CheckOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/CheckOptions.plist" \
            -exportPath "$RUNNER_TEMP/check" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc_key.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
          mkdir -p "$RUNNER_TEMP/check/ipa"
          unzip -q "$RUNNER_TEMP"/check/*.ipa -d "$RUNNER_TEMP/check/ipa"
          codesign -d --entitlements - --xml "$RUNNER_TEMP"/check/ipa/Payload/*.app > "$RUNNER_TEMP/check/entitlements.plist"
          aps=$(/usr/libexec/PlistBuddy -c "Print :aps-environment" "$RUNNER_TEMP/check/entitlements.plist" 2>/dev/null || true)
          echo "aps-environment of the signed app: ${aps:-missing}"
          if [ "$aps" != "production" ]; then
            echo "::error::The signed app has no production aps-environment, so it could not receive pushes (#149). Not uploaded."
            exit 1
          fi

      - name: Sign with the Distribution certificate and upload to TestFlight
        # Automatic signing at export: the App Store profile for the bundle ID is
        # made or fetched with the API key, and the only Distribution identity in
        # the keychain is the imported one. A `testflight` build goes up for
        # internal testing only (testFlightInternalTestingOnly, #146): Xcode's
        # help says such a build "cannot be distributed via external TestFlight
        # or the App Store", so its open chat never reaches App Review.
        working-directory: app/ios
        env:
          APP_BUILD: ${{ inputs.build }}
        run: |
          internal=false
          if [ "$APP_BUILD" = testflight ]; then internal=true; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>testFlightInternalTestingOnly</key><$internal/>
          </dict></plist>
          EOF
          echo "Internal testing only: $internal"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc_key.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Remove the key and the keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc_key.p8" "$RUNNER_TEMP/dist.p12"
          if [ -n "$KEYCHAIN_PATH" ]; then security delete-keychain "$KEYCHAIN_PATH"; fi
