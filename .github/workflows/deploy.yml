name: Deploy

# On every merge to main: apply new D1 migrations, load docs/sources.csv (with
# the names in docs/source-names.csv), then deploy the Worker.
# Needs the repository secret CLOUDFLARE_API_TOKEN (see docs/setup.md). Until
# it exists, the run ends with a warning instead of failing.

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "docs/sources.csv"
      - "docs/source-names.csv"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check the Cloudflare token
        id: token
        # Runs before checkout, so not in server/.
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so nothing was deployed (see docs/setup.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.token.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - if: steps.token.outputs.ready == 'true'
        run: npm ci
      # Two pull requests can each pass alone and still break together, so main is
      # tested again here; nothing reaches the live database or Worker if it fails.
      - if: steps.token.outputs.ready == 'true'
        name: Typecheck and test before deploying
        run: npm run typecheck && npm test
      - if: steps.token.outputs.ready == 'true'
        name: Apply D1 migrations
        run: npm run db:migrate:remote
      - if: steps.token.outputs.ready == 'true'
        name: Load the source list
        run: npm run sources:remote
      - if: steps.token.outputs.ready == 'true'
        name: Deploy the Worker
        run: npm run deploy
