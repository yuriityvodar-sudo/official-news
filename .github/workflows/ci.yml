name: CI

on:
  pull_request:
  # The merge queue (30 Oct): GitHub tests each queued pull request on top of
  # the latest main before it merges it, one at a time.
  merge_group:
  push:
    branches: [main]

jobs:
  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # A time zone with clock changes, so the day-label tests mean something (UTC has none).
      - run: flutter test
        env:
          TZ: Europe/Berlin

  server:
    name: Server (Worker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      # A merge committed with its conflict markers still left in (it happened once, 16 Oct) fails here.
      - name: No merge conflict markers
        working-directory: .
        run: |
          if git grep -n -E '^(<<<<<<<|>>>>>>>)( |$)|^=======$' -- . ':!*.lock'; then
            echo "::error::Merge conflict markers are committed in the files above."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
